<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Terminal: whoami — Pierre Dolivet, full-stack developer. Front: React, Next.js, Vue, TypeScript, Tailwind, Vite. Back: PHP, Symfony, Laravel, Python, Java, C#/.NET. Ops: Docker, CI/CD, Coolify, Linux server security. OS: Linux, Windows, macOS. Generative AI in my workflow since the early days of GitHub Copilot.">
  <defs>
    <clipPath id="win"><rect x="1" y="1" width="1198" height="468" rx="14"/></clipPath>
  </defs>

  <style>
    text { white-space: pre; font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; font-size: 18px; fill: #c9d1d9; }
    .p { fill: #7ee787; } .k { fill: #b9a8ff; } .s { fill: #a5d6ff; } .m { fill: #8b949e; } .w { fill: #fff; }
    .win { animation: in .6s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: center; }
    /* each line is hidden by a cover rect that slides right: steps() = typing, linear = fast print */
    .c { animation: type var(--t) var(--e) var(--d) both; }
    .cur { animation: show 0s 5s both, blink 1s steps(1) 5s infinite; }

    @keyframes in    { from { opacity: 0; transform: translateY(20px) scale(.98) } }
    @keyframes type  { to { transform: translateX(var(--w)) } }
    @keyframes show  { from { opacity: 0 } }
    @keyframes blink { 50% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .c { display: none; } }
  </style>

  <g class="win">
    <rect x="1" y="1" width="1198" height="468" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <g clip-path="url(#win)">
      <rect x="1" y="1" width="1198" height="44" fill="#161b22"/>
      <circle cx="30" cy="23" r="7" fill="#ff5f57"/>
      <circle cx="54" cy="23" r="7" fill="#febc2e"/>
      <circle cx="78" cy="23" r="7" fill="#28c840"/>
      <text x="600" y="29" text-anchor="middle" class="m" style="font-size:14px">pierre@github: ~</text>

      <text x="40" y="90"><tspan class="p">$</tspan> <tspan class="w">whoami</tspan></text>
      <text x="40" y="118">Pierre Dolivet — full-stack developer who loves crafting for the web</text>

      <text x="40" y="174"><tspan class="p">$</tspan> <tspan class="w">cat stack.txt</tspan></text>
      <text x="40" y="202"><tspan class="k">front </tspan>  React · Next.js · Vue · TypeScript · Tailwind · Vite</text>
      <text x="40" y="230"><tspan class="k">back  </tspan>  PHP · Symfony · Laravel · Python · Java · C# / .NET</text>
      <text x="40" y="258"><tspan class="k">ops   </tspan>  Docker · CI/CD · Coolify self-hosting · Linux server security</text>
      <text x="40" y="286"><tspan class="k">os    </tspan>  Linux · Windows · macOS</text>
      <text x="40" y="314"><tspan class="k">ai    </tspan>  Generative AI in my workflow since the early days of GitHub Copilot</text>

      <text x="40" y="370"><tspan class="p">$</tspan> <tspan class="w">echo $MOTTO</tspan></text>
      <text x="40" y="398" class="s">"Ship it, then make it beautiful."</text>

      <text x="40" y="434" class="p">$</text>
      <rect class="cur" x="62" y="418" width="11" height="21" fill="#c9d1d9"/>

      <g fill="#0d1117">
        <rect class="c" x="36" y="68"  width="1170" height="28" style="--d:.5s;  --t:.7s;  --e:steps(8);  --w:88px"/>
        <rect class="c" x="36" y="96"  width="1170" height="28" style="--d:1.4s; --t:.4s;  --e:linear;    --w:1170px"/>
        <rect class="c" x="36" y="152" width="1170" height="28" style="--d:2s;   --t:.9s;  --e:steps(15); --w:165px"/>
        <rect class="c" x="36" y="180" width="1170" height="28" style="--d:3s;   --t:.35s; --e:linear;    --w:1170px"/>
        <rect class="c" x="36" y="208" width="1170" height="28" style="--d:3.15s;--t:.35s; --e:linear;    --w:1170px"/>
        <rect class="c" x="36" y="236" width="1170" height="28" style="--d:3.3s; --t:.35s; --e:linear;    --w:1170px"/>
        <rect class="c" x="36" y="264" width="1170" height="28" style="--d:3.45s;--t:.35s; --e:linear;    --w:1170px"/>
        <rect class="c" x="36" y="292" width="1170" height="28" style="--d:3.6s; --t:.35s; --e:linear;    --w:1170px"/>
        <rect class="c" x="36" y="348" width="1170" height="28" style="--d:4.1s; --t:.6s;  --e:steps(13); --w:143px"/>
        <rect class="c" x="36" y="376" width="1170" height="28" style="--d:4.75s;--t:.3s;  --e:linear;    --w:1170px"/>
        <rect class="c" x="36" y="412" width="1170" height="30" style="--d:5s;   --t:0s;   --e:linear;    --w:1170px"/>
      </g>
    </g>
  </g>
</svg>
