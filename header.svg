<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Pierre Dolivet — Full-stack developer, UX/UI design friendly">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1038"/>
    </linearGradient>
    <radialGradient id="o1"><stop offset="0" stop-color="#7c5cff" stop-opacity=".9"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2"><stop offset="0" stop-color="#00d4ff" stop-opacity=".7"/><stop offset="1" stop-color="#00d4ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="o3"><stop offset="0" stop-color="#ff4ecd" stop-opacity=".6"/><stop offset="1" stop-color="#ff4ecd" stop-opacity="0"/></radialGradient>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9a8ff"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="80" x2="500">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset=".5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff4ecd"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    .orb { transform-box: fill-box; transform-origin: center; }
    .o1 { animation: pop 1.2s ease-out both, float1 9s ease-in-out 1.2s infinite; }
    .o2 { animation: pop 1.2s ease-out .2s both, float2 11s ease-in-out 1.4s infinite; }
    .o3 { animation: pop 1.2s ease-out .4s both, float1 13s ease-in-out 1.6s infinite reverse; }
    .grid { animation: fade 1.5s ease-out both; }
    .hello { animation: rise .7s cubic-bezier(.2,.8,.2,1) .3s both; }
    .name { animation: rise .9s cubic-bezier(.2,.8,.2,1) .5s both, track 1.2s cubic-bezier(.2,.8,.2,1) .5s both; }
    .sub { animation: rise .8s cubic-bezier(.2,.8,.2,1) 1s both; }
    .bar { stroke-dasharray: 420; animation: draw 1.2s cubic-bezier(.6,0,.2,1) 1.2s both; }
    .tag { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
    .t1 { animation-delay: 1.6s; } .t2 { animation-delay: 1.72s; } .t3 { animation-delay: 1.84s; }
    .t4 { animation-delay: 1.96s; } .t5 { animation-delay: 2.08s; } .t6 { animation-delay: 2.2s; }
    .dot { animation: blink 1.6s ease-in-out 2.4s infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: fade 1s 1.4s both, rot 30s linear infinite; }

    @keyframes fade  { from { opacity: 0 } }
    @keyframes pop   { from { opacity: 0; transform: scale(.4) } }
    @keyframes rise  { from { opacity: 0; transform: translateY(18px) } }
    @keyframes track { from { letter-spacing: 18px } }
    @keyframes draw  { from { stroke-dashoffset: 420 } }
    @keyframes blink { 50% { opacity: .25 } }
    @keyframes rot   { to { transform: rotate(360deg) } }
    @keyframes float1 { 50% { transform: translate(40px, -25px) } }
    @keyframes float2 { 50% { transform: translate(-50px, 20px) } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect class="grid" width="1200" height="320" fill="url(#grid)"/>
    <circle class="orb o1" cx="980" cy="70" r="220" fill="url(#o1)"/>
    <circle class="orb o2" cx="1120" cy="280" r="180" fill="url(#o2)"/>
    <circle class="orb o3" cx="760" cy="300" r="160" fill="url(#o3)"/>

    <!-- decorative ring, right side -->
    <g class="spin">
      <circle cx="980" cy="160" r="105" fill="none" stroke="#fff" stroke-opacity=".18" stroke-dasharray="2 10"/>
      <circle cx="980" cy="160" r="70" fill="none" stroke="#fff" stroke-opacity=".12"/>
      <circle cx="980" cy="55" r="5" fill="#00d4ff"/>
    </g>
    <text class="mono" x="980" y="168" text-anchor="middle" font-size="26" fill="#fff" fill-opacity=".85">&lt;/&gt;</text>
  </g>

  <text class="mono hello" x="80" y="100" font-size="18" fill="#00d4ff">
    <tspan class="dot">●</tspan> Hi there, I'm
  </text>
  <text class="sans name" x="78" y="168" font-size="64" font-weight="800" fill="url(#txt)" letter-spacing="1">Pierre Dolivet</text>
  <text class="sans sub" x="80" y="210" font-size="22" fill="#c9cde0">Full-stack developer · DevOps · UX/UI design friendly</text>
  <path class="bar" d="M80 232H500" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>

  <g class="mono" font-size="14" fill="#e6e8f2">
    <g class="tag t1"><rect x="80"  y="254" width="108" height="30" rx="15" fill="#fff" fill-opacity=".08" stroke="#3178c6" stroke-opacity=".8"/><text x="134" y="274" text-anchor="middle">TypeScript</text></g>
    <g class="tag t2"><rect x="198" y="254" width="64"  height="30" rx="15" fill="#fff" fill-opacity=".08" stroke="#8892bf" stroke-opacity=".8"/><text x="230" y="274" text-anchor="middle">PHP</text></g>
    <g class="tag t3"><rect x="272" y="254" width="76"  height="30" rx="15" fill="#fff" fill-opacity=".08" stroke="#61dafb" stroke-opacity=".6"/><text x="310" y="274" text-anchor="middle">React</text></g>
    <g class="tag t4"><rect x="358" y="254" width="88"  height="30" rx="15" fill="#fff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".5"/><text x="402" y="274" text-anchor="middle">Symfony</text></g>
    <g class="tag t5"><rect x="456" y="254" width="88"  height="30" rx="15" fill="#fff" fill-opacity=".08" stroke="#ff2d20" stroke-opacity=".6"/><text x="500" y="274" text-anchor="middle">Laravel</text></g>
    <g class="tag t6"><rect x="554" y="254" width="80"  height="30" rx="15" fill="#fff" fill-opacity=".08" stroke="#2496ed" stroke-opacity=".7"/><text x="594" y="274" text-anchor="middle">Docker</text></g>
  </g>
</svg>
